plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Keep Jupiter, parameterized tests, and the platform launcher on compatible versions.
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

application {
    mainClass = 'friday.Friday'
}

tasks.named('run', JavaExec) {
    // Gradle otherwise supplies an empty input stream to the console chatbot.
    standardInput = System.in
    // Keep the existing data/friday.txt location independent of how Gradle is invoked.
    workingDir = projectDir
}
